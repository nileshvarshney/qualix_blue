services:
  # ── Ollama LLM service ────────────────────────────────────────────────────
  - type: web
    name: qualix-ollama
    runtime: docker
    dockerfilePath: ./ollama/Dockerfile
    dockerContext: ./ollama
    plan: standard          # needs ~2.5GB RAM for qwen2.5:3b
    healthCheckPath: /api/tags
    autoDeploy: true
    disk:
      name: ollama-models
      mountPath: /root/.ollama
      sizeGB: 10
    envVars:
      - key: OLLAMA_MODEL
        value: qwen2.5:3b

  # ── FastAPI backend ───────────────────────────────────────────────────────
  - type: web
    name: qualix-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 8000
      - key: AUTH_REQUIRED
        value: "false"
      - key: ALLOWED_ORIGINS
        value: https://qualix.nileshv.workers.dev,http://localhost:3000,http://localhost:3002
      - key: LLM_PROVIDER
        value: ollama
      - key: OLLAMA_MODEL
        value: qwen2.5:3b
      - key: OLLAMA_BASE_URL
        fromService:
          name: qualix-ollama
          type: web
          property: host
      - key: AUTO_RULES_ENABLED
        value: "true"
      - key: AUTO_RULES_MAX_PER_TABLE
        value: "10"

      # ── Set these in the Render dashboard (secrets) ──
      - key: SF_PLATFORM_ACCOUNT
        sync: false
      - key: SF_PLATFORM_USER
        sync: false
      - key: SF_PLATFORM_PASSWORD
        sync: false
      - key: SF_PLATFORM_WAREHOUSE
        sync: false
      - key: SF_PLATFORM_ROLE
        sync: false
      - key: SNOWFLAKE_APP_DATABASE
        sync: false
      - key: SNOWFLAKE_APP_SCHEMA
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
