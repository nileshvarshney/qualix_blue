# Alembic configuration for DataGuard
# The actual database URL is set dynamically in migrations/env.py
# Default: postgresql+asyncpg://dquser:dqpass@localhost:5432/dqplatform
# Override: set DATABASE_URL environment variable

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# sqlalchemy.url is overridden in env.py via DATABASE_URL env var
sqlalchemy.url = postgresql+asyncpg://dquser:dqpass@localhost:5432/dqplatform

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
